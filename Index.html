<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para ti ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 100%;
            padding: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 35px;
            font-weight: normal;
        }

        .bouquet {
            position: relative;
            width: 280px;
            height: 380px;
            margin: auto;
        }

        .rose {
            position: absolute;
            font-size: 70px;
            opacity: 0;
            transform: scale(0);
            animation: aparecer 1s forwards;
        }

        .rose:nth-child(1) {
            left: 95px;
            top: 40px;
            animation-delay: 1s;
        }

        .rose:nth-child(2) {
            left: 35px;
            top: 90px;
            animation-delay: 1.6s;
        }

        .rose:nth-child(3) {
            right: 35px;
            top: 90px;
            animation-delay: 2.2s;
        }

        .rose:nth-child(4) {
            left: 70px;
            top: 145px;
            animation-delay: 2.8s;
        }

        .rose:nth-child(5) {
            right: 70px;
            top: 145px;
            animation-delay: 3.4s;
        }

        .stem {
            position: absolute;
            width: 8px;
            height: 180px;
            background: #285c2a;
            left: 136px;
            top: 150px;
            border-radius: 10px;
        }

        .message {
            opacity: 0;
            margin-top: -10px;
            animation: mensaje 2s forwards;
            animation-delay: 5s;
        }

        .message p {
            font-size: 19px;
            line-height: 1.6;
        }

        .heart {
            font-size: 35px;
            margin-top: 15px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes mensaje {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .petalo {
            position: fixed;
            top: -20px;
            animation: caer linear infinite;
            opacity: 0.8;
        }

        @keyframes caer {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hice algo para ti ❤️</h1>

    <div class="bouquet">

        <div class="stem"></div>

        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>
        <div class="rose">🌹</div>

    </div>

    <div class="message">

        <p>
            No sabía cómo regalarte flores,
            así que decidí hacerlas yo mismo. 🌹
        </p>

        <p>
            Espero que te gusten tanto
            como tú me gustas a mí.
        </p>

        <div class="heart">❤️</div>

    </div>

</div>

<script>

    function crearPetalo() {

        const petalo = document.createElement("div");

        petalo.className = "petalo";
        petalo.innerHTML = "🌸";

        petalo.style.left = Math.random() * 100 + "vw";
        petalo.style.fontSize = (12 + Math.random() * 18) + "px";
        petalo.style.animationDuration = (5 + Math.random() * 5) + "s";

        document.body.appendChild(petalo);

        setTimeout(() => {
            petalo.remove();
        }, 10000);
    }

    setInterval(crearPetalo, 500);

</script>

</body>
</html>
